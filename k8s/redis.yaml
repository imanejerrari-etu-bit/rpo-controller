apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    dir /data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  serviceName: redis
  replicas: 3   # redis-0 = primary, redis-1/redis-2 = replicas (paper: "one primary and two replicas")
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:8.6.2   # if this tag doesn't exist, check https://hub.docker.com/_/redis/tags and adjust
          ports:
            - containerPort: 6379
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ORDINAL=$(echo $HOSTNAME | grep -o '[0-9]*$')
              if [ "$ORDINAL" = "0" ]; then
                echo "Starting redis-0 as PRIMARY"
                exec redis-server /etc/redis/redis.conf
              else
                echo "Starting redis-$ORDINAL as REPLICA of redis-0.redis"
                exec redis-server /etc/redis/redis.conf --replicaof redis-0.redis 6379
              fi
          # NOTE: this is the pod the PI controller must target — label it
          # explicitly for the fault-injection PodSelector (see below).
          resources:
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "1", memory: "1Gi" }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
# NOTE: StatefulSet pods automatically get the label
# statefulset.kubernetes.io/pod-name=redis-0 (etc.) — use that, combined
# with app.kubernetes.io/name=redis, as the PodSelector for the primary
# in run_fault_injection.ps1. No manual labelling needed.
